<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".delete-image").forEach(button => {
      button.addEventListener("click", function () {
        let pictureId = this.getAttribute("data-picture-id");
        let imageContainer = document.getElementById("image-" + pictureId);

        if (confirm("Are you sure you want to delete this image?")) {
          fetch("{{ @BASE }}/task/deleteimage", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({ picture_id: pictureId })
          })
          .then(response => response.json())
          .then(data => {
            if (data.success) {
              imageContainer.remove(); // Ensure the image is removed from the DOM
            } else {
              alert("Error deleting image.");
            }
          })
          .catch(error => {
            console.error("Error:", error);
            alert("Failed to delete the image.");
          });
        }
      });
    });
  });
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const urlParams = new URLSearchParams(window.location.search);
    const activeTab = urlParams.get("tab");

    if (activeTab === "images") {
      let imagesTab = document.getElementById("simple-tab-3");
      let imagesTabPanel = document.getElementById("simple-tabpanel-3");

      if (imagesTab && imagesTabPanel) {
        // Remove active class from other tabs
        document.querySelectorAll(".nav-link").forEach(tab => tab.classList.remove("active"));
        document.querySelectorAll(".tab-pane").forEach(panel => panel.classList.remove("active", "show"));

        // Set active class on the images tab
        imagesTab.classList.add("active");
        imagesTabPanel.classList.add("active", "show");
      }
    }
  });
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  // Handle Toggle Switch for Read/Unread
  document.querySelectorAll(".toggle-read").forEach(toggle => {
    toggle.addEventListener("change", function () {
      const notificationId = this.dataset.id;
      const isRead = this.checked ? 1 : 0; // 1 if checked, 0 otherwise
      // Send AJAX request to update the notification state
      fetch(`/notification/update_status/${notificationId}/`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ is_read: isRead })
      }).then(response => {
        if (response.ok) {
          location.reload(); // Reload to update the UI
        }
      });
    });
  });
});
</script>

<script>
    // Sample data for notifications
    const notifications = [
        {
            type: "project",
            message: "You have been added to the project: <strong>Website Redesign</strong>.",
            timestamp: "2025-01-25 14:30:00",
        },
        {
            type: "task",
            message: "You have been assigned the task: <strong>Client Follow-Up</strong>.",
            timestamp: "2025-01-25 15:00:00",
        },
    ];

    // Function to generate notification HTML
    function displayNotifications(notifications) {
        const notificationArea = document.getElementById("notification-area");

        if (notifications.length === 0) {
            notificationArea.innerHTML = `
                <div class="alert alert-secondary" role="alert">
                    No new notifications at the moment.
                </div>`;
            return;
        }

        notifications.forEach((notification) => {
            const alertType = notification.type === "project" ? "info" : "success";

            const notificationHTML = `
                <div class="alert alert-${alertType} alert-dismissible fade show" role="alert">
                    <i class="bi ${alertType === "info" ? "bi-folder-plus" : "bi-check-circle"}"></i>
                    &nbsp; ${notification.message} 
                    <small class="text-muted d-block mt-1">Received: ${new Date(notification.timestamp).toLocaleString()}</small>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;

            notificationArea.insertAdjacentHTML("beforeend", notificationHTML);
        });
    }

    // Display notifications on page load
    document.addEventListener("DOMContentLoaded", () => {
        displayNotifications(notifications);
    });
</script>
