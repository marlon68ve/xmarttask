<main class="col-md-9 ml-sm-auto col-lg-10 px-md-4 py-4">


<h1>{{ @i18n.ui.i18n_user.':  '.@POST.username }} (<em><check if="{{ @POST.user_type }}==1"><true>{{ @i18n.ui.i18n_usertype }}</true><false><check if="{{ @POST.user_type }}==10"><true>{{ @i18n.ui.i18n_superusertype }}</true><false>{{ @i18n.ui.i18n_admintype }}</false></check></false>
		  </check></em>)</h1>
	<form action="" method="post" class="form-horizontal">
	<div class="row py-5">
		<div class="col-6">
		  <h4>Email: {{ @POST.email }}</h4>
		  <h4>{{ @i18n.ui.i18n_activated.': ' }}<select name="activated">
			<option value=1<check if="{{ intval(@POST.activated)===1 }}"> selected</check>>{{ @i18n.ui.i18n_yes }}</option>
			<option value=0<check if="{{ intval(@POST.activated)===0 }}"> selected</check>>{{ @i18n.ui.i18n_no }}</option>
		  </select></h4>
		</div>


		<div class="col-6">
			<h2>{{ @i18n.ui.i18n_changepassword }}</h2>
			<p>{{ @i18n.ui.i18n_userchgpsw }}</p>
			<div class="form-group">
				<label class="control-label" for="claveusuario">{{ @i18n.ui.i18n_password }}</label>
				<input type="password" class="form-control" name="claveusuario" id="claveusuario" />
			</div>
			<div class="form-group">
				<label class="control-label" for="confirm">{{ @i18n.ui.i18n_password_conf }}</label>
				<input type="password" class="form-control" name="confirm" id="confirm" />
			</div>

		</div>
	</div>
	<div class="row">
		<div class="col-12">
			<div class="col-lg-xs text-center py-5">
				<input type="hidden" name="session_csrf" value="{{ @CSRF }}" />
				<input type="hidden" name="edit" value="edit" />
				<input type="hidden" name="user_id" value="{{ @POST.id }}" />
				<input type="hidden" name="pw" value="{{ @POST.password }}" />
				<button type="submit" class="btn btn-primary"> {{ @i18n.ui.i18n_update }}</button>
			</div>
		</div>
	</div>
	</form>
</div>
</main>
